# .github/workflows/build-and-push.yml
name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 563748380420.dkr.ecr.us-east-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push app image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          yump-app:latest
          yump-app:${{ github.sha }}
          ${{ env.ECR_REGISTRY }}/yumpy-dog-app:latest
          ${{ env.ECR_REGISTRY }}/yumpy-dog-app:${{ github.sha }}
    
    - name: Build and push worker image
      uses: docker/build-push-action@v5
      with:
        context: ./worker
        file: ./worker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          yump-worker:latest
          yump-worker:${{ github.sha }}
          ${{ env.ECR_REGISTRY }}/yumpy-dog-worker:latest
          ${{ env.ECR_REGISTRY }}/yumpy-dog-worker:${{ github.sha }}
