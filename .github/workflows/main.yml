# .github/workflows/main.yml
name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 563748380420.dkr.ecr.us-east-2.amazonaws.com
  ECS_CLUSTER: lovable-cat-duu7xu
  ECS_WORKER_SERVICE: yumpy-worker-service-9a9d07j2
  ECS_APP_SERVICE: yumpy-application-service-05gssb9v

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify task definition files exist
      run: |
        ls -la ecs/
        cat ecs/yumpy-application.json | jq '.containerDefinitions[].name'
        cat ecs/yumpy-worker.json | jq '.containerDefinitions[].name'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push app image
      id: build-app-image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.ECR_REGISTRY }}/yumpy-dog-app:latest
          ${{ env.ECR_REGISTRY }}/yumpy-dog-app:${{ github.sha }}
    
    - name: Build and push worker image
      id: build-worker-image
      uses: docker/build-push-action@v5
      with:
        context: ./worker
        file: ./worker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.ECR_REGISTRY }}/yumpy-dog-worker:latest
          ${{ env.ECR_REGISTRY }}/yumpy-dog-worker:${{ github.sha }}

    - name: Fill in the new app image ID in the Amazon ECS task definition
      id: app-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
          task-definition: ecs/yumpy-application.json
          container-name: yumpy-application
          image: ${{ env.ECR_REGISTRY }}/yumpy-dog-app:${{ github.sha }}
          
    - name: Fill in the new worker image ID in the Amazon ECS task definition
      id: worker-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
          task-definition: ecs/yumpy-worker.json
          container-name: yumpy-worker
          image: ${{ env.ECR_REGISTRY }}/yumpy-dog-worker:${{ github.sha }}

    - name: Deploy App Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
          task-definition: ${{ steps.app-task-def.outputs.task-definition }}
          service: ${{ env.ECS_APP_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
          
    - name: Deploy Worker Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true